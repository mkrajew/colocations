[project]
name = "patterns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.3",
    "matplotlib>=3.9",
    "osmnx>=2.1.0",
    "scipy>=1.17.1",
    "typer>=0.25.0",
]

[project.scripts]
main = "src.main:app"
dataset = "src.dataset:app"
visualize = "src.visualize:app"

[dependency-groups]
dev = ["pytest>=8.0"]


[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
